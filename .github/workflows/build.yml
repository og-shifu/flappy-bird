name: Build Flappy Bird APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository 📁
        uses: actions/checkout@v4

      - name: Set up Python 🐍
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies 📦
        run: |
          sudo apt update
          sudo apt install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev cmake
          pip install --upgrade buildozer cython

      - name: Accept Android SDK Licenses 📜
        run: |
          mkdir -p ~/.buildozer/android/platform/android-sdk/licenses
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --sdk_root=$HOME/.buildozer/android/platform/android-sdk --licenses || true

      - name: Build APK with Buildozer 🚀
        run: |
          yes | buildozer android debug

      - name: Upload APK artifact 📤
        uses: actions/upload-artifact@v4
        with:
          name: FlappyBird-APK
          path: bin/*.apk
